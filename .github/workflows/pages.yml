name: Publish playable game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and publish Photo Frenzy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game syntax and scoring
        run: |
          npm run check
          npm test
      - name: Prepare the static website
        run: |
          mkdir -p _site
          cp index.html styles.css README.md .nojekyll _site/
          cp -R src assets _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the playable website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
